<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tanveer Associates — AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon-900:#00a843;
    --maroon-800:#279b44;
    --maroon-700:#3ab073;
    --maroon-600:#148e3d;
    --maroon-050:#FBEEEE;
    --gold-500:#F4B400;
    --gold-600:#D99E00;
    --cream:#FBF8F5;
    --paper:#FFFFFF;
    --ink-900:#241010;
    --ink-600:#5A4A4A;
    --ink-300:#B9A9A9;
    --line:#EFE1E1;
    --success:#28C76F;
    --shadow-lg: 0 24px 60px -12px rgba(74,8,8,0.35), 0 8px 20px -6px rgba(74,8,8,0.18);
    --shadow-sm: 0 6px 18px -6px rgba(74,8,8,0.35);
    --radius-panel: 22px;
    --radius-bubble: 16px;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background: url('background.png') no-repeat center top / cover fixed;
    color:var(--ink-900);
    min-height:100vh;
    overflow-y:auto;
  }

  /* ---------- demo backdrop (represents "the website") ---------- */
  .demo-page{
    max-width:640px;
    padding:64px 40px;
    text-align:center;
  }
  .demo-page .eyebrow{
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--maroon-700);
    font-weight:700;
    margin-bottom:14px;
  }
  .demo-page h1{
    font-family:'Playfair Display',serif;
    font-size:40px;
    line-height:1.15;
    margin:0 0 18px;
    color:var(--ink-900);
  }
  .demo-page h1 span{color:var(--maroon-700);}
  .demo-page p{
    color:var(--ink-600);
    font-size:16px;
    line-height:1.7;
    margin:0 auto;
    max-width:460px;
  }



  /* =====================================================
     FLOATING WIDGET ROOT
  ===================================================== */
  #gf-widget{
    position:fixed;
    right:28px;
    bottom:28px;
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    font-family:'Inter',sans-serif;
  }

  /* ---------- Launcher (closed state) ---------- */
  .gf-launcher{
    position:relative;
    width:64px;
    height:64px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:linear-gradient(155deg, var(--maroon-600), var(--maroon-800));
    box-shadow:var(--shadow-lg);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    transition:transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .28s ease;
  }
  .gf-launcher:hover{transform:translateY(-3px) scale(1.04);}
  .gf-launcher:focus-visible{outline:3px solid var(--gold-500); outline-offset:3px;}
  .gf-launcher .gf-ring{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border:1.5px solid rgba(122,14,14,0.35);
    animation:gf-pulse 2.6s ease-out infinite;
  }
  @keyframes gf-pulse{
    0%{transform:scale(.92); opacity:.9;}
    80%{transform:scale(1.28); opacity:0;}
    100%{transform:scale(1.28); opacity:0;}
  }
  .gf-launcher img{
    width:38px;
    height:38px;
    border-radius:50%;
    object-fit:cover;
    display:block;
  }
  .gf-launcher .gf-close-icon{
    width:22px;
    height:22px;
    stroke:#fff;
    display:none;
  }
  .gf-launcher.is-open .gf-close-icon{display:block;}
  .gf-launcher.is-open img{display:none;}
  .gf-launcher .gf-badge{
    position:absolute;
    top:-2px;
    right:-2px;
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--success);
    border:2.5px solid var(--cream);
  }
  .gf-launcher.is-open .gf-badge{display:none;}

  .gf-whatsapp-btn{
    position:fixed;
    right:28px;
    bottom:108px;
    z-index:9998;
    width:56px;
    height:56px;
    border:none;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg, #25D366, #128C7E);
    box-shadow:var(--shadow-lg);
    cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease;
    text-decoration:none;
  }
  .gf-whatsapp-btn:hover{transform:translateY(-3px) scale(1.04); box-shadow:0 18px 32px -12px rgba(18,140,126,0.4);}
  .gf-whatsapp-btn svg{width:28px;height:28px;fill:#fff;}

  .gf-messenger-btn{
    position:fixed;
    right:28px;
    bottom:176px;
    z-index:9998;
    width:56px;
    height:56px;
    border:none;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg, #0084FF, #0066CC);
    box-shadow:var(--shadow-lg);
    cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease;
    text-decoration:none;
  }
  .gf-messenger-btn:hover{transform:translateY(-3px) scale(1.04); box-shadow:0 18px 32px -12px rgba(0,132,255,0.4);}
  .gf-messenger-btn svg{width:28px;height:28px;fill:#fff;}

  /* ---------- Panel (open state) ---------- */
  .gf-panel{
    position:absolute;
    bottom:80px;
    right:0;
    width:380px;
    max-width:calc(100vw - 40px);
    height:600px;
    max-height:calc(100vh - 140px);
    background:var(--paper);
    border-radius:var(--radius-panel);
    box-shadow:var(--shadow-lg);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    transform:translateY(16px) scale(.96);
    opacity:0;
    pointer-events:none;
    transition:transform .3s cubic-bezier(.2,.9,.3,1.2), opacity .22s ease;
  }
  .gf-panel.is-open{
    transform:translateY(0) scale(1);
    opacity:1;
    pointer-events:auto;
  }

  /* ---- header ---- */
  .gf-header{
    background:linear-gradient(135deg, var(--maroon-700), var(--maroon-900));
    padding:20px 18px;
    display:flex;
    align-items:flex-start;
    gap:14px;
    position:relative;
    flex-shrink:0;
  }
  .gf-header::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 90% -10%, rgba(244,180,0,0.16), transparent 55%);
    pointer-events:none;
  }
  .gf-avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#fff;
    padding:2px;
    flex-shrink:0;
    box-shadow:0 2px 8px rgba(0,0,0,0.25);
  }
  .gf-avatar img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
  }
  .gf-header-text{flex:1; min-width:0; padding-top:1px;}
  .gf-header-text h2{
    font-family:'Playfair Display',serif;
    font-size:19px;
    font-weight:700;
    color:#fff;
    margin:0 0 2px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .gf-header-text .gf-tag{
    font-size:12.5px;
    color:rgba(255,255,255,0.82);
    margin:0 0 8px;
    font-weight:500;
  }
  .gf-status{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:rgba(255,255,255,0.9);
  }
  .gf-status .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--success);
    box-shadow:0 0 0 3px rgba(40,199,111,0.25);
    flex-shrink:0;
  }
  .gf-header-close{
    background:rgba(255,255,255,0.12);
    border:none;
    width:30px;
    height:30px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:background .2s ease;
  }
  .gf-header-close:hover{background:rgba(255,255,255,0.24);}
  .gf-header-close svg{width:15px;height:15px;stroke:#fff;}

  /* ---- body / message stream ---- */
  .gf-body{
    flex:1;
    overflow-y:auto;
    padding:18px 16px 8px;
    display:flex;
    flex-direction:column;
    gap:12px;
    background:
      linear-gradient(180deg, var(--maroon-050) 0%, var(--cream) 140px);
  }
  .gf-body::-webkit-scrollbar{width:6px;}
  .gf-body::-webkit-scrollbar-thumb{background:var(--ink-300); border-radius:3px;}

  .gf-msg-row{display:flex; flex-direction:column; max-width:88%;}
  .gf-msg-row.bot{align-self:flex-start;}
  .gf-msg-row.user{align-self:flex-end; align-items:flex-end;}

  .gf-bubble{
    padding:12px 14px;
    border-radius:var(--radius-bubble);
    font-size:14px;
    line-height:1.55;
    word-wrap:break-word;
  }
  .gf-msg-row.bot .gf-bubble{
    background:#F3EDED;
    color:var(--ink-900);
    border-bottom-left-radius:5px;
  }
  .gf-msg-row.user .gf-bubble{
    background:linear-gradient(135deg, var(--maroon-700), var(--maroon-600));
    color:#fff;
    border-bottom-right-radius:5px;
  }
  .gf-bubble b{color:var(--maroon-700);}
  .gf-msg-row.user .gf-bubble b{color:var(--gold-500);}

  /* --- Formatted bot message content --- */
  .gf-bubble .gf-heading{
    display:block;
    font-weight:700;
    color:var(--maroon-700);
    font-size:13.5px;
    margin-top:10px;
    margin-bottom:2px;
    letter-spacing:.01em;
  }
  .gf-bubble .gf-heading:first-child{margin-top:0;}
  .gf-bubble .gf-para{
    display:block;
    margin-bottom:8px;
  }
  .gf-bubble .gf-para:last-child{margin-bottom:0;}
  .gf-timestamp{
    font-size:10.5px;
    color:var(--ink-300);
    margin-top:4px;
    padding:0 3px;
  }

  /* typing indicator */
  .gf-typing{
    display:flex;
    gap:4px;
    padding:14px 16px;
    background:#F3EDED;
    border-radius:var(--radius-bubble);
    border-bottom-left-radius:5px;
    align-self:flex-start;
    width:fit-content;
  }
  .gf-typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--maroon-700);
    opacity:.5;
    animation:gf-bounce 1.1s infinite ease-in-out;
  }
  .gf-typing span:nth-child(2){animation-delay:.15s;}
  .gf-typing span:nth-child(3){animation-delay:.3s;}
  @keyframes gf-bounce{
    0%,60%,100%{transform:translateY(0); opacity:.4;}
    30%{transform:translateY(-4px); opacity:1;}
  }

  /* quick reply buttons */
  .gf-quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:2px;
  }
  .gf-quick-grid .gf-quick-full{grid-column:1 / -1;}
  .gf-quick-btn{
    display:flex;
    align-items:center;
    gap:8px;
    justify-content:flex-start;
    background:#fff;
    border:1.5px solid var(--maroon-700);
    color:var(--maroon-700);
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:12.5px;
    padding:11px 12px;
    border-radius:12px;
    cursor:pointer;
    transition:background .18s ease, color .18s ease, transform .15s ease;
    text-align:left;
    line-height:1.25;
  }
  .gf-quick-btn:hover{
    background:var(--maroon-700);
    color:#fff;
    transform:translateY(-1px);
  }
  .gf-quick-btn .emoji{font-size:15px; flex-shrink:0;}

  /* ---- footer / input ---- */
  .gf-footer{
    flex-shrink:0;
    border-top:1px solid var(--line);
    background:var(--paper);
    padding:12px 14px 10px;
  }
  .gf-input-row{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--cream);
    border:1.5px solid var(--line);
    border-radius:24px;
    padding:5px 5px 5px 16px;
    transition:border-color .2s ease;
  }
  .gf-input-row:focus-within{border-color:var(--maroon-700);}
  .gf-input-row input{
    flex:1;
    border:none;
    background:transparent;
    outline:none;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    color:var(--ink-900);
    min-width:0;
  }
  .gf-input-row input::placeholder{color:var(--ink-300);}
  .gf-send-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    border:none;
    background:var(--maroon-700);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:background .18s ease, transform .15s ease;
  }
  .gf-send-btn:hover{background:var(--maroon-800); transform:scale(1.05);}
  .gf-send-btn:disabled{background:var(--ink-300); cursor:not-allowed; transform:none;}
  .gf-send-btn svg{width:16px; height:16px; margin-left:1px;}
  .gf-powered{
    text-align:center;
    font-size:10.5px;
    color:var(--ink-300);
    margin:9px 0 0;
    letter-spacing:.02em;
  }
  .gf-powered b{color:var(--maroon-700);}

  /* Clickable links inside bot messages */
  .gf-bubble a{
    color:#1a7f37;
    text-decoration:underline;
    text-underline-offset:2px;
    word-break:break-all;
    transition:color .15s;
  }
  .gf-bubble a:hover{ color:#0d5a23; }

  @media (max-width:480px){
    #gf-widget{right:16px; bottom:16px;}
    .gf-whatsapp-btn{
      right:16px;
      bottom:104px;
      width:52px;
      height:52px;
    }
    .gf-messenger-btn{
      right:16px;
      bottom:164px;
      width:52px;
      height:52px;
    }
    .gf-panel{
      width:calc(100vw - 24px);
      height:calc(100vh - 110px);
      bottom:76px;
      right:-4px;
    }
  }

  @media (prefers-reduced-motion: reduce){
    .gf-launcher, .gf-panel, .gf-quick-btn, .gf-send-btn, .gf-ring, .gf-typing span{
      animation:none !important;
      transition:none !important;
    }
  }
</style>
</head>
<body>

<!-- ============ demo backdrop representing the client's website ============ -->
<div class="demo-page">

</div>

<!-- ============================================================
     GOFOREIGN CHAT WIDGET
============================================================= -->
<div id="gf-widget">

  <div class="gf-panel" id="gfPanel" role="dialog" aria-label="Tanveer Associates chat assistant">

    <!-- header -->
    <div class="gf-header">
      <div class="gf-avatar">
        <img src="Tanveer Associates logo.png" alt="Tanveer Associates logo">

        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>

    <!-- messages -->
    <div class="gf-body" id="gfBody">

      <div class="gf-quick-grid" id="gfQuickGrid">
        <button class="gf-quick-btn" data-msg="What projects does Tanveer Associates offer?"><span class="emoji">🏗️</span> Our Projects</button>
        <button class="gf-quick-btn" data-msg="What are the available plots and properties?"><span class="emoji">🏠</span> Properties & Plots</button>
        <button class="gf-quick-btn" data-msg="Tell me about payment plans and pricing"><span class="emoji">💰</span> Payment Plans</button>

        <button class="gf-quick-btn gf-quick-full" data-msg="I'd like to speak with a specialist"><span class="emoji">💬</span> Talk to a Specialist</button>

    <!-- input -->
    <div class="gf-footer">
      <div class="gf-input-row">
        <input type="text" id="gfInput" placeholder="Type your message..." autocomplete="off">
        <button class="gf-send-btn" id="gfSendBtn" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="#fff"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>
      <p class="gf-powered">Powered by <b>Tanveer Associates</b></p>
    </div>
  </div>

  <!-- launcher -->
  <button class="gf-launcher" id="gfLauncher" aria-label="Open chat with Tanveer Associates">
    <span class="gf-ring"></span>
    <span class="gf-badge"></span>
    <img src="Tanveer Associates logo.png" alt="">
    <svg class="gf-close-icon" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <a class="gf-whatsapp-btn" href="https://wa.me/923303681690?text=Hello%20Tanveer%20Associates" target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp with Tanveer Associates">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2.5C6.58 2.5 2.18 6.88 2.18 12.32c0 1.94.53 3.82 1.53 5.47L2 22l4.35-1.14a10.09 10.09 0 0 0 5.69 1.63h.01c5.46 0 9.86-4.38 9.86-9.82 0-2.63-1.08-5.1-2.97-6.95A9.86 9.86 0 0 0 12.04 2.5Zm0 17.96c-1.54 0-3.04-.42-4.35-1.2l-.31-.19-2.58.68.69-2.51-.2-.33a8.55 8.55 0 0 1-1.3-4.6c0-4.73 3.84-8.57 8.57-8.57 2.29 0 4.44.89 6.06 2.52a8.49 8.49 0 0 1 2.52 6.05c0 4.73-3.84 8.57-8.57 8.57Zm4.73-6.4c-.26-.13-1.53-.75-1.77-.84-.24-.09-.42-.13-.59.13-.18.26-.68.84-.84 1.02-.15.18-.31.2-.57.06-.26-.13-1.1-.4-2.1-1.29-.77-.69-1.3-1.54-1.45-1.8-.15-.26-.02-.4.11-.53.11-.11.26-.29.39-.44.13-.14.17-.25.26-.41.08-.16.04-.31-.02-.44-.06-.13-.58-1.4-.8-1.92-.2-.5-.42-.43-.58-.43h-.5c-.17 0-.45.06-.68.31-.24.25-.9.88-.9 2.16 0 1.29.93 2.5 1.06 2.67.13.17 1.83 2.8 4.44 3.92.62.27 1.1.43 1.47.55.62.2 1.18.17 1.63.1.5-.07 1.53-.63 1.74-1.24.22-.61.22-1.13.15-1.24-.08-.11-.24-.18-.5-.31Z"/></svg>
  </a>
  <a class="gf-messenger-btn" href="https://m.me/111165190800045" target="_blank" rel="noopener noreferrer" aria-label="Chat on Messenger">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.75C6.62 2.75 2.25 6.73 2.25 11.8c0 2.73 1.18 5.18 3.06 6.83v2.77l2.79-1.53c.73.2 1.49.3 2.28.3 5.38 0 9.75-3.98 9.75-9.05 0-5.07-4.37-9.05-9.75-9.05Zm1.01 12.02L10.6 11.3l-4.06 2.24 4.44-4.72 2.41 2.41 4.06-2.24-4.44 4.72Z"/></svg>
  </a>
</div>

<script>
(function(){
  // ---------------------------------------------------------
  // CONFIG — point this at your FastAPI backend (see original
  // Streamlit app: POST {API_URL}/chat  -> { message, history })
  // ---------------------------------------------------------
  const API_URL = "http://localhost:8000";
  const MAX_HISTORY_MESSAGES = 5; // pairs of user/assistant turns

  const launcher   = document.getElementById('gfLauncher');
  const panel      = document.getElementById('gfPanel');
  const headerClose= document.getElementById('gfHeaderClose');
  const body       = document.getElementById('gfBody');
  const input      = document.getElementById('gfInput');
  const sendBtn    = document.getElementById('gfSendBtn');
  const quickGrid  = document.getElementById('gfQuickGrid');

  // session history, mirrors st.session_state.messages: [[role, content], ...]
  let history = [];
  // Persist a session id across page reloads so the backend's LangGraph
  // memory (short_term_memory.py) can resume this person's conversation
  // and known lead info instead of starting fresh every time.
  let sessionId = localStorage.getItem('gfSessionId');
  if (!sessionId) {
    sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
    localStorage.setItem('gfSessionId', sessionId);
  }

  function timeNow(){
    return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }
  document.getElementById('gfWelcomeTime').textContent = timeNow();

  function openPanel(){
    panel.classList.add('is-open');
    launcher.classList.add('is-open');
    setTimeout(()=>input.focus(), 250);
  }
  function closePanel(){
    panel.classList.remove('is-open');
    launcher.classList.remove('is-open');
  }
  launcher.addEventListener('click', ()=>{
    panel.classList.contains('is-open') ? closePanel() : openPanel();
  });
  headerClose.addEventListener('click', closePanel);

  function scrollToBottom(){
    body.scrollTop = body.scrollHeight;
  }

  /* Escape HTML to prevent XSS */
  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  /* Convert plain-text bot reply into structured HTML:
     - Strip markdown characters (**, *, #, -)
     - Detect heading patterns like "1. Construction: description"
       and render heading bold with description on next line
     - Double newlines become paragraph breaks
     - Single newlines become <br> */
  function formatBotMessage(text){
    // --- Step 1: Extract markdown links [text](url) BEFORE stripping ---
    // Replace with temporary placeholders to protect them from escaping
    var linkStore = [];
    var withPlaceholders = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(_, linkText, url){
      var idx = linkStore.length;
      linkStore.push({text: linkText, url: url});
      return '%%LINK' + idx + '%%';
    });

    // Strip markdown-style formatting before escaping
    var cleaned = withPlaceholders
      .replace(/\*\*([^*]+)\*\*/g, '$1')   // **bold** → bold
      .replace(/\*([^*]+)\*/g, '$1')        // *italic* → italic
      .replace(/^#{1,3}\s*/gm, '')          // ### heading → heading
      .replace(/^[-•]\s+/gm, '');           // - bullet → bullet

    var safe = escapeHtml(cleaned);

    // --- Step 2: Restore markdown links as clickable <a> tags ---
    safe = safe.replace(/%%LINK(\d+)%%/g, function(_, idx){
      var link = linkStore[parseInt(idx)];
      return '<a href="' + escapeHtml(link.url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(link.text) + '</a>';
    });

    // --- Step 3: Auto-link bare URLs that aren't already inside an <a> tag ---
    safe = safe.replace(/(?<!href=")(?<!>)(https?:\/\/[^\s<)"]+)/g, function(url){
      return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
    });

    // Split on double newlines (paragraphs)
    var paragraphs = safe.split(/\n\s*\n/);
    return paragraphs.map(function(para){
      var lines = para.split(/\n/);
      var formatted = lines.map(function(line){
        var trimmed = line.trim();
        if(!trimmed) return '';

        // Pattern 1: Standalone heading — line ending with ":"
        if(/^[^:]{1,50}:$/.test(trimmed)){
          return '<span class="gf-heading">' + trimmed + '</span>';
        }

        // Pattern 2: Numbered heading with content — "1. Something: description"
        var numberedMatch = trimmed.match(/^(\d+\.\s+[^:]{1,50}:)\s*(.*)$/);
        if(numberedMatch){
          var result = '<span class="gf-heading">' + numberedMatch[1] + '</span>';
          if(numberedMatch[2]) result += '<br>' + numberedMatch[2];
          return result;
        }

        // Pattern 3: Plain heading with content — "Something: description"
        // Only match if the heading part is short (2-40 chars) and starts with uppercase
        var headingMatch = trimmed.match(/^([A-Z][^:]{1,39}:)\s+(.+)$/);
        if(headingMatch){
          var result2 = '<span class="gf-heading">' + headingMatch[1] + '</span>';
          if(headingMatch[2]) result2 += '<br>' + headingMatch[2];
          return result2;
        }

        return trimmed;
      }).filter(Boolean).join('<br>');
      return '<span class="gf-para">' + formatted + '</span>';
    }).join('');
  }

  function addMessage(role, text){
    const row = document.createElement('div');
    row.className = 'gf-msg-row ' + (role === 'user' ? 'user' : 'bot');
    const bubble = document.createElement('div');
    bubble.className = 'gf-bubble';
    if(role === 'user'){
      bubble.textContent = text;
    } else {
      bubble.innerHTML = formatBotMessage(text);
    }
    const ts = document.createElement('div');
    ts.className = 'gf-timestamp';
    ts.textContent = timeNow();
    row.appendChild(bubble);
    row.appendChild(ts);
    body.appendChild(row);
    scrollToBottom();
  }

  function showTyping(){
    const wrap = document.createElement('div');
    wrap.className = 'gf-typing';
    wrap.id = 'gfTyping';
    wrap.innerHTML = '<span></span><span></span><span></span>';
    body.appendChild(wrap);
    scrollToBottom();
  }
  function hideTyping(){
    const t = document.getElementById('gfTyping');
    if(t) t.remove();
  }

  function buildHistoryPayload(){
    // mirror _build_history(): last N exchanges formatted for the API
    const recent = history.slice(-(MAX_HISTORY_MESSAGES * 2));
    return recent.map(([role, content]) => ({ role, content }));
  }

  async function sendToBackend(message){
    try{
      const res = await fetch(`${API_URL}/chat`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ message, session_id: sessionId })
      });
      if(!res.ok) throw new Error('bad-status');
      const data = await res.json();
      if (data.session_id) {
        sessionId = data.session_id;
        localStorage.setItem('gfSessionId', sessionId);
      }
      return data.answer;
    }catch(err){
      if(err.message === 'Failed to fetch' || err instanceof TypeError){
        return "Backend is not running.";
      }
      return "Something went wrong. Please try again.";
    }
  }

  async function handleUserMessage(text){
    if(!text.trim()) return;
    quickGrid.style.display = 'none';
    addMessage('user', text);
    history.push(['user', text]);
    input.value = '';
    sendBtn.disabled = true;
    showTyping();

    const answer = await sendToBackend(text);

    hideTyping();
    addMessage('assistant', answer);
    history.push(['assistant', answer]);
    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.addEventListener('click', ()=> handleUserMessage(input.value));
  input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') handleUserMessage(input.value);
  });
  quickGrid.addEventListener('click', (e)=>{
    const btn = e.target.closest('.gf-quick-btn');
    if(btn) handleUserMessage(btn.dataset.msg);
  });
})();
</script>
